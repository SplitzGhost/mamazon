# Bringt den Server (worker/) automatisch zu Cloudflare, sobald sich auf main
# etwas daran ändert. Über "Run workflow" lässt er sich auch von Hand starten.
name: Server veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Beim Einfügen (z. B. auf dem iPad) rutschen leicht Zeilenumbrüche oder
      # Leerzeichen in die Secrets, die Cloudflare dann ablehnt.
      - name: Zu Cloudflare veröffentlichen
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config worker/wrangler.toml
        env:
          RAW_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
