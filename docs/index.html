<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>MamaZon</title>
  <meta name="description" content="Der Shop für Mama: Dienstleistungen von Arne, bezahlt mit MumCoins.">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MamaZon">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gPink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7bab"/><stop offset="1" stop-color="#ff2d78"/></linearGradient>
      <linearGradient id="gSoft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd3e3"/><stop offset="1" stop-color="#ffa9c9"/></linearGradient>
      <linearGradient id="gWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe9f1"/></linearGradient>
      <linearGradient id="gCoin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9cc0"/><stop offset=".55" stop-color="#ff3f84"/><stop offset="1" stop-color="#e01563"/></linearGradient>
      <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
    </defs>
  </svg>

  <div id="stage">
    <div id="device">
      <div id="island"></div>
      <div id="screen">
        <div id="aurora"><i></i><i></i><i></i></div>
        <div id="app"></div>
        <div id="layer"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
